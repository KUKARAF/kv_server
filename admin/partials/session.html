<section>
  <h2>Current Session</h2>

  <div id="session-info"
       hx-get="/api/admin/session"
       hx-trigger="load"
       hx-swap="innerHTML">
    Loading...
  </div>

  <div style="margin-top:1rem;">
    <button type="button" class="btn-secondary" onclick="generateDeviceToken()">
      Generate device token (180 days)
    </button>
  </div>

  <div id="device-token-reveal" class="share-reveal hidden" style="margin-top:1rem;">
    <div class="share-reveal-header">
      <span>📱 Device token generated — copy it now</span>
      <button type="button" class="btn-icon" onclick="document.getElementById('device-token-reveal').classList.add('hidden')">✕</button>
    </div>
    <p class="share-reveal-warn">This token is shown <strong>once</strong>. Store it in the Android app immediately.</p>
    <div style="display:flex;justify-content:center;margin:0.75rem 0;">
      <div id="device-token-qr"></div>
    </div>
    <div class="share-reveal-url">
      <code id="device-token-value" style="word-break:break-all;"></code>
      <button type="button" class="btn-secondary" onclick="copyDeviceToken()">Copy</button>
    </div>
  </div>
</section>

<script>
  document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.pathInfo?.requestPath === '/api/admin/session') {
      renderSession(e.detail.xhr.response, e.detail.xhr.status);
    }
  });

  function renderSession(json, status) {
    const el = document.getElementById('session-info');
    if (status !== 200) { el.innerHTML = '<p>Not authenticated.</p>'; return; }
    const s = JSON.parse(json);
    el.innerHTML = `
      <dl>
        <dt>Email</dt><dd>${esc(s.email)}</dd>
        <dt>Subject</dt><dd><code>${esc(s.oidc_subject)}</code></dd>
        <dt>Expires</dt><dd>${esc(s.expires_at)}</dd>
        <dt>Created</dt><dd>${esc(s.created_at)}</dd>
      </dl>`;
  }

  async function generateDeviceToken() {
    const resp = await fetch('/api/admin/session/device-token', { method: 'POST' });
    if (!resp.ok) { alert('Failed to generate device token: ' + resp.status); return; }
    const token = await resp.json();
    document.getElementById('device-token-value').textContent = token;

    const qrEl = document.getElementById('device-token-qr');
    qrEl.innerHTML = '';
    new QRCode(qrEl, {
      text: 'kvapp://device-token?key=' + encodeURIComponent(token),
      width: 200,
      height: 200,
      colorDark: '#ffffff',
      colorLight: '#1a1a1a',
    });

    document.getElementById('device-token-reveal').classList.remove('hidden');
  }

  function copyDeviceToken() {
    navigator.clipboard.writeText(document.getElementById('device-token-value').textContent);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
