<section>
  <h2>API Keys</h2>

  <form id="create-key-form" onsubmit="return createKey(event)">
    <fieldset>
      <legend>Create key</legend>
      <label>Label <input name="label" required></label>
      <label>Type
        <select name="key_type">
          <option value="standard">Standard</option>
          <option value="one_time">One-time</option>
          <option value="approval_required">Approval required</option>
        </select>
      </label>
      <label>Expires at (optional) <input name="expires_at" type="datetime-local"></label>

      <details>
        <summary>Scope rules</summary>
        <div id="scope-rules">
          <div class="scope-row">
            <input name="key_pattern" placeholder="payments-*">
            <input name="ops" placeholder="read,write">
          </div>
        </div>
        <button type="button" onclick="addScope()">+ Add scope</button>
      </details>

      <button type="submit">Create</button>
    </fieldset>
  </form>

  <div id="key-reveal" class="key-reveal hidden">
    <strong>New key (shown once):</strong>
    <code id="key-reveal-value"></code>
    <button type="button" onclick="this.closest('.key-reveal').classList.add('hidden')">Dismiss</button>
  </div>

  <div id="keys-list"
       hx-get="/api/admin/keys"
       hx-trigger="load"
       hx-swap="outerHTML">
    Loading...
  </div>
</section>

<script>
  function addScope() {
    const div = document.createElement('div');
    div.className = 'scope-row';
    div.innerHTML = `
      <input name="key_pattern" placeholder="key-*">
      <input name="ops" placeholder="read,write">
      <button type="button" onclick="this.closest('.scope-row').remove()">✕</button>
    `;
    document.getElementById('scope-rules').appendChild(div);
  }

  async function createKey(e) {
    e.preventDefault();
    const form = e.target;
    const scopes = Array.from(form.querySelectorAll('#scope-rules .scope-row'))
      .map(row => ({
        key_pattern: row.querySelector('[name=key_pattern]').value.trim(),
        ops: row.querySelector('[name=ops]').value.trim(),
      }))
      .filter(s => s.key_pattern && s.ops);

    const body = {
      label: form.label.value.trim(),
      key_type: form.key_type.value,
      expires_at: form.expires_at.value || null,
      scopes,
    };

    const resp = await fetch('/api/admin/keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      alert('Error creating key: ' + resp.status);
      return false;
    }

    const data = await resp.json();
    document.getElementById('key-reveal-value').textContent = data.key;
    document.getElementById('key-reveal').classList.remove('hidden');

    form.reset();
    htmx.trigger(document.getElementById('keys-list'), 'load');
    return false;
  }

  document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.pathInfo?.requestPath === '/api/admin/keys') {
      renderKeys(e.detail.xhr.response);
    }
  });

  function renderKeys(json) {
    const keys = JSON.parse(json);
    const el = document.getElementById('keys-list');
    if (!keys.length) { el.innerHTML = '<p>No keys yet.</p>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Label</th><th>Type</th><th>Status</th><th>Scopes</th><th>Expires</th><th>Last used</th><th></th></tr></thead>
      <tbody>${keys.map(k => `
        <tr>
          <td>${esc(k.label)}</td>
          <td><span class="badge badge-${k.key_type}">${k.key_type}</span></td>
          <td><span class="badge badge-${k.status}">${k.status}</span></td>
          <td><small>${k.scopes.map(s => `${esc(s.key_pattern)} [${esc(s.ops)}]`).join('<br>')}</small></td>
          <td>${k.expires_at ? esc(k.expires_at) : '—'}</td>
          <td>${k.last_used_at ? esc(k.last_used_at) : '—'}</td>
          <td>
            <button hx-delete="/api/admin/keys/${esc(k.id)}"
                    hx-target="#keys-list"
                    hx-swap="outerHTML"
                    hx-confirm="Revoke this key?">Revoke</button>
          </td>
        </tr>`).join('')}
      </tbody></table>`;
    htmx.process(el);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
