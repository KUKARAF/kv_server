<section>
  <h2>API Keys</h2>

  <form id="create-key-form" onsubmit="return createKey(event)" class="panel">
    <h3>Create key</h3>
    <div class="form-row-2">
      <label>Label <input name="label" required placeholder="thinkpad deploy key"></label>
      <label>Type
        <select name="key_type">
          <option value="standard">Standard</option>
          <option value="one_time">One-time</option>
          <option value="approval_required">Approval required</option>
          <option value="zero_trust">Zero Trust</option>
        </select>
      </label>
    </div>
    <label>Expires at (optional) <input name="expires_at" type="datetime-local"></label>

    <div id="allowed-keys-wrap">
      <p class="label-sm">Allowed keys <span class="hint">(leave empty to allow no keys)</span></p>
      <div id="allowed-keys-tags" class="tag-input-wrap"></div>
      <div class="tag-add-row">
        <input id="allowed-key-input" list="kv-keys-list" placeholder="Type or select a key name…">
        <datalist id="kv-keys-list"></datalist>
        <button type="button" class="btn-secondary" onclick="addAllowedKey()">+ Add</button>
      </div>
    </div>

    <button type="submit">Create</button>
  </form>

  <div id="key-reveal" class="key-reveal hidden">
    <strong>New key — copy now, shown once:</strong>
    <code id="key-reveal-value" class="key-value"></code>
    <button type="button" class="btn-secondary" onclick="document.getElementById('key-reveal').classList.add('hidden')">Dismiss</button>
  </div>

  <div id="keys-list" hx-get="/api/admin/keys" hx-trigger="load" hx-swap="none">
    Loading…
  </div>
</section>

<script>
  async function loadKvKeys() {
    const resp = await fetch('/api/admin/kv/keys');
    if (!resp.ok) return;
    const keys = await resp.json();
    const dl = document.getElementById('kv-keys-list');
    dl.innerHTML = keys.map(k => `<option value="${esc(k)}">`).join('');
  }
  loadKvKeys();

  function addAllowedKey() {
    const input = document.getElementById('allowed-key-input');
    const val = input.value.trim();
    if (!val) return;
    const wrap = document.getElementById('allowed-keys-tags');
    if (Array.from(wrap.querySelectorAll('[data-key]')).some(t => t.dataset.key === val)) {
      input.value = '';
      return;
    }
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.dataset.key = val;
    tag.innerHTML = `${esc(val)} <button type="button" onclick="this.parentElement.remove()">✕</button>`;
    wrap.appendChild(tag);
    input.value = '';
  }

  document.getElementById('allowed-key-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addAllowedKey(); }
  });

  async function createKey(e) {
    e.preventDefault();
    const form = e.target;
    const allowedKeys = Array.from(
      document.getElementById('allowed-keys-tags').querySelectorAll('[data-key]')
    ).map(t => t.dataset.key);

    const body = {
      label: form.label.value.trim(),
      key_type: form.key_type.value,
      expires_at: form.expires_at.value || null,
      allowed_keys: allowedKeys,
    };

    const resp = await fetch('/api/admin/keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) { alert('Error creating key: ' + resp.status); return false; }

    const data = await resp.json();
    const reveal = document.getElementById('key-reveal');
    document.getElementById('key-reveal-value').textContent = data.key;
    reveal.classList.remove('hidden');

    form.reset();
    document.getElementById('allowed-keys-tags').innerHTML = '';
    htmx.trigger(document.getElementById('keys-list'), 'load');
    return false;
  }

  document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.pathInfo?.requestPath === '/api/admin/keys') {
      renderKeys(e.detail.xhr.response);
    }
  });

  function renderKeys(json) {
    const keys = JSON.parse(json);
    const el = document.getElementById('keys-list');
    const inactive = ['revoked', 'used'];
    if (!keys.length) { el.innerHTML = '<p>No keys yet.</p>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Label</th><th>Type</th><th>Status</th><th>Allowed keys</th><th>Expires</th><th>Last used</th><th></th></tr></thead>
      <tbody>${keys.map(k => {
        const isInactive = inactive.includes(k.status);
        const action = isInactive
          ? `<button class="btn-danger"
                     hx-delete="/api/admin/keys/${esc(k.id)}"
                     hx-swap="none"
                     hx-confirm="Permanently delete this key?"
                     hx-on::after-request="htmx.trigger(document.getElementById('keys-list'), 'load')">Delete</button>`
          : `<button hx-post="/api/admin/keys/${esc(k.id)}/revoke"
                     hx-swap="none"
                     hx-confirm="Revoke this key?"
                     hx-on::after-request="htmx.trigger(document.getElementById('keys-list'), 'load')">Revoke</button>`;
        const keyType = k.key_type;
        const allowedKeysCell = (keyType === 'session' || keyType === 'approval')
          ? '<em>all</em>'
          : k.allowed_keys.length
            ? `<small>${k.allowed_keys.map(esc).join('<br>')}</small>`
            : '<small style="color:#888">none</small>';
        return `
        <tr>
          <td>${esc(k.label)}</td>
          <td><span class="badge badge-${k.key_type}">${esc(k.key_type)}</span></td>
          <td><span class="badge badge-${k.status}">${esc(k.status)}</span></td>
          <td>${allowedKeysCell}</td>
          <td>${k.expires_at ? esc(k.expires_at) : '—'}</td>
          <td>${k.last_used_at ? esc(k.last_used_at) : '—'}</td>
          <td>${action}</td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
    htmx.process(el);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
