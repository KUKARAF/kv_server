<section>
  <h2>API Keys</h2>

  <datalist id="key-scopes-list"></datalist>

  <form id="create-key-form" onsubmit="return createKey(event)" class="panel">
    <h3>Create key</h3>
    <div class="form-row-2">
      <label>Label <input name="label" required placeholder="thinkpad deploy key"></label>
      <label>Type
        <select name="key_type">
          <option value="standard">Standard</option>
          <option value="one_time">One-time</option>
          <option value="approval_required">Approval required</option>
          <option value="zero_trust">Zero Trust</option>
        </select>
      </label>
    </div>
    <label>Expires at (optional) <input name="expires_at" type="datetime-local"></label>

    <div id="scope-rules-wrap">
      <p class="label-sm">Scope rules</p>
      <table class="scope-table">
        <thead><tr><th>Key pattern</th><th>R</th><th>W</th><th></th></tr></thead>
        <tbody id="scope-rules">
          <tr class="scope-row">
            <td><input name="key_pattern" list="key-scopes-list" placeholder="osmosis/deployment"></td>
            <td class="ops-cell"><input type="checkbox" name="ops_read" checked></td>
            <td class="ops-cell"><input type="checkbox" name="ops_write"></td>
            <td><button type="button" class="btn-icon" onclick="this.closest('.scope-row').remove()">✕</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn-secondary" onclick="addScope()">+ Add scope rule</button>
    </div>

    <button type="submit">Create</button>
  </form>

  <div id="key-reveal" class="key-reveal hidden">
    <strong>New key — copy now, shown once:</strong>
    <code id="key-reveal-value" class="key-value"></code>
    <button type="button" class="btn-secondary" onclick="document.getElementById('key-reveal').classList.add('hidden')">Dismiss</button>
  </div>

  <div id="keys-list" hx-get="/api/admin/keys" hx-trigger="load" hx-swap="none">
    Loading…
  </div>
</section>

<script>
  async function loadKeyScopes() {
    const resp = await fetch('/api/admin/kv/scopes');
    if (!resp.ok) return;
    const scopes = await resp.json();
    const dl = document.getElementById('key-scopes-list');
    dl.innerHTML = scopes.map(s => `<option value="${esc(s)}">`).join('');
  }
  loadKeyScopes();

  function addScope() {
    const tr = document.createElement('tr');
    tr.className = 'scope-row';
    tr.innerHTML = `
      <td><input name="key_pattern" list="key-scopes-list" placeholder="osmosis/deployment"></td>
      <td class="ops-cell"><input type="checkbox" name="ops_read" checked></td>
      <td class="ops-cell"><input type="checkbox" name="ops_write"></td>
      <td><button type="button" class="btn-icon" onclick="this.closest('.scope-row').remove()">✕</button></td>
    `;
    document.getElementById('scope-rules').appendChild(tr);
  }

  async function createKey(e) {
    e.preventDefault();
    const form = e.target;
    const scopes = Array.from(form.querySelectorAll('#scope-rules .scope-row'))
      .map(row => {
        const pattern = row.querySelector('[name=key_pattern]').value.trim();
        const r = row.querySelector('[name=ops_read]').checked;
        const w = row.querySelector('[name=ops_write]').checked;
        const ops = [r && 'read', w && 'write'].filter(Boolean).join(',');
        return { key_pattern: pattern, ops };
      })
      .filter(s => s.key_pattern && s.ops);

    const body = {
      label: form.label.value.trim(),
      key_type: form.key_type.value,
      expires_at: form.expires_at.value || null,
      scopes,
    };

    const resp = await fetch('/api/admin/keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) { alert('Error creating key: ' + resp.status); return false; }

    const data = await resp.json();
    const reveal = document.getElementById('key-reveal');
    document.getElementById('key-reveal-value').textContent = data.key;
    reveal.classList.remove('hidden');

    form.reset();
    htmx.trigger(document.getElementById('keys-list'), 'load');
    return false;
  }

  document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.pathInfo?.requestPath === '/api/admin/keys') {
      renderKeys(e.detail.xhr.response);
    }
  });

  function renderKeys(json) {
    const keys = JSON.parse(json);
    const el = document.getElementById('keys-list');
    const inactive = ['revoked', 'used'];
    if (!keys.length) { el.innerHTML = '<p>No keys yet.</p>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Label</th><th>Type</th><th>Status</th><th>Scopes</th><th>Expires</th><th>Last used</th><th></th></tr></thead>
      <tbody>${keys.map(k => {
        const isInactive = inactive.includes(k.status);
        const action = isInactive
          ? `<button class="btn-danger"
                     hx-delete="/api/admin/keys/${esc(k.id)}"
                     hx-swap="none"
                     hx-confirm="Permanently delete this key?"
                     hx-on::after-request="htmx.trigger(document.getElementById('keys-list'), 'load')">Delete</button>`
          : `<button hx-post="/api/admin/keys/${esc(k.id)}/revoke"
                     hx-swap="none"
                     hx-confirm="Revoke this key?"
                     hx-on::after-request="htmx.trigger(document.getElementById('keys-list'), 'load')">Revoke</button>`;
        return `
        <tr>
          <td>${esc(k.label)}</td>
          <td><span class="badge badge-${k.key_type}">${esc(k.key_type)}</span></td>
          <td><span class="badge badge-${k.status}">${esc(k.status)}</span></td>
          <td><small>${k.scopes.map(s => `${esc(s.key_pattern)} [${esc(s.ops)}]`).join('<br>')}</small></td>
          <td>${k.expires_at ? esc(k.expires_at) : '—'}</td>
          <td>${k.last_used_at ? esc(k.last_used_at) : '—'}</td>
          <td>${action}</td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
    htmx.process(el);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
