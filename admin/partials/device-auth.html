<div id="devices-root">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
    <h2 style="font-size:1rem;font-weight:600;margin:0;">Registered Devices</h2>
    <div style="display:flex;gap:0.5rem;">
      <button class="btn-secondary" style="font-size:0.8em;" onclick="addPhone()">Add phone</button>
      <button class="btn-secondary" style="font-size:0.8em;" onclick="toggleCliPanel()">Add CLI</button>
      <button class="btn-secondary" style="font-size:0.8em;" onclick="loadDevices()">Refresh</button>
    </div>
  </div>
  <div id="devices-table-wrap"></div>

  <div id="cli-token-reveal" class="share-reveal hidden" style="margin-top:1rem;">
    <div class="share-reveal-header">
      <span>⌨️ CLI token</span>
      <button type="button" class="btn-icon" onclick="closeCliPanel()">✕</button>
    </div>
    <div style="padding:1rem 1.25rem;">
      <label style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;font-size:13px;color:var(--muted);">
        Valid for <strong id="cli-days-label" style="color:var(--fg);min-width:3ch;text-align:right;">1</strong> day(s)
        <input id="cli-days-slider" type="range" min="1" max="7" value="1"
               oninput="document.getElementById('cli-days-label').textContent=this.value"
               style="flex:1;accent-color:var(--accent);">
      </label>
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <button class="btn-secondary" style="font-size:0.85em;" onclick="generateCliToken()">Generate</button>
        <code id="cli-token-value" style="flex:1;word-break:break-all;font-size:12px;color:var(--accent);display:none;"></code>
        <button id="cli-copy-btn" class="btn-secondary" style="font-size:0.85em;display:none;" onclick="copyCliToken()">Copy</button>
      </div>
    </div>
  </div>

  <div id="phone-qr-reveal" class="share-reveal hidden" style="margin-top:1rem;">
    <div class="share-reveal-header">
      <span>📱 Scan with KV Approver app</span>
      <button type="button" class="btn-icon" onclick="closePhoneQr()">✕</button>
    </div>
    <p class="share-reveal-warn">Valid for <strong>180 days</strong>. Scan once — navigating away loses the code.</p>
    <div style="display:flex;justify-content:center;padding:1rem;">
      <div id="phone-qr-canvas" style="background:#fff;padding:12px;display:inline-block;"></div>
    </div>
  </div>
</div>

<script>
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadDevices() {
    const wrap = document.getElementById('devices-table-wrap');
    wrap.innerHTML = '<p style="color:var(--muted);font-size:13px;">Loading…</p>';

    const resp = await fetch('/api/admin/devices');
    if (!resp.ok) {
      wrap.innerHTML = '<p style="color:var(--danger);font-size:13px;">Failed to load devices (' + resp.status + ').</p>';
      return;
    }

    const devices = await resp.json();

    if (devices.length === 0) {
      wrap.innerHTML = '<p style="color:var(--muted);font-size:13px;">No devices registered.</p>';
      return;
    }

    let html = '<table style="width:100%;border-collapse:collapse;">'
      + '<thead><tr>'
      + '<th style="text-align:left;padding:6px 8px;font-size:12px;color:var(--muted);font-weight:500;">Name</th>'
      + '<th style="text-align:left;padding:6px 8px;font-size:12px;color:var(--muted);font-weight:500;">Registered</th>'
      + '<th></th>'
      + '</tr></thead><tbody>';

    for (const d of devices) {
      html += '<tr style="border-top:1px solid var(--border);">'
        + '<td style="padding:8px;">' + esc(d.name) + '</td>'
        + '<td style="padding:8px;color:var(--muted);font-size:12px;">' + esc(d.created_at) + '</td>'
        + '<td style="padding:8px;text-align:right;">'
        + '<button class="btn-secondary" style="font-size:0.8em;color:var(--danger);" data-id="' + esc(d.id) + '" onclick="deleteDevice(this.dataset.id, this)">Delete</button>'
        + '</td>'
        + '</tr>';
    }

    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  async function deleteDevice(id, btn) {
    btn.disabled = true;
    const resp = await fetch('/api/admin/devices/' + encodeURIComponent(id), { method: 'DELETE' });
    if (resp.ok) {
      showToast('Device removed.', { type: 'success' });
      loadDevices();
    } else {
      showToast('Failed to remove device (' + resp.status + ').', { type: 'error' });
      btn.disabled = false;
    }
  }

  function toggleCliPanel() {
    const el = document.getElementById('cli-token-reveal');
    el.classList.toggle('hidden');
    if (!el.classList.contains('hidden')) {
      document.getElementById('cli-token-value').style.display = 'none';
      document.getElementById('cli-copy-btn').style.display = 'none';
      document.getElementById('cli-days-slider').value = 1;
      document.getElementById('cli-days-label').textContent = '1';
    }
  }

  function closeCliPanel() {
    document.getElementById('cli-token-reveal').classList.add('hidden');
  }

  async function generateCliToken() {
    const days = parseInt(document.getElementById('cli-days-slider').value, 10);
    const resp = await fetch('/api/admin/session/cli-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ days }),
    });
    if (!resp.ok) { showToast('Failed to generate token: ' + resp.status, { type: 'error' }); return; }
    const token = await resp.json();
    const el = document.getElementById('cli-token-value');
    el.textContent = token;
    el.style.display = '';
    document.getElementById('cli-copy-btn').style.display = '';
  }

  function copyCliToken() {
    navigator.clipboard.writeText(document.getElementById('cli-token-value').textContent);
    showToast('Token copied', { type: 'success' });
  }

  async function addPhone() {
    const resp = await fetch('/api/admin/session/device-token', { method: 'POST' });
    if (!resp.ok) { showToast('Failed to generate token: ' + resp.status, { type: 'error' }); return; }
    const token = await resp.json();
    const container = document.getElementById('phone-qr-canvas');
    container.innerHTML = '';
    new QRCode(container, { text: token, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
    document.getElementById('phone-qr-reveal').classList.remove('hidden');
  }

  function closePhoneQr() {
    document.getElementById('phone-qr-reveal').classList.add('hidden');
  }

  loadDevices();
</script>
