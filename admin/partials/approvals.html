<section id="notices-section" style="margin-bottom:2rem;">
  <h2>Notices</h2>
  <p style="color:#666;font-size:12px;margin-bottom:0.75rem;">Recipients who bypassed a required key when submitting secrets.</p>
  <div id="faux-approvals-list">Loading...</div>
</section>

<section>
  <h2>Pending Approvals</h2>
  <p>The requester will tell you 3 emojis. Type their names below to find and select them, then confirm.</p>

  <div id="approvals-list"
       hx-get="/api/admin/approvals"
       hx-trigger="load, every 30s"
       hx-swap="innerHTML">
    Loading...
  </div>
</section>


<script>
  // Loaded from /admin/emoji.json — generated by .tools/get_emojis.sh
  let EMOJI_DATA = [];
  fetch('/admin/emoji.json')
    .then(r => r.json())
    .then(data => { EMOJI_DATA = data; })
    .catch(e => console.error('Failed to load emoji data', e));

  document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.pathInfo?.requestPath === '/api/admin/approvals') {
      renderApprovals(e.detail.xhr.response);
    }
  });

  function renderApprovals(json) {
    const items = JSON.parse(json);
    const el = document.getElementById('approvals-list');
    if (!items.length) { el.innerHTML = '<p>No pending approvals.</p>'; return; }
    el.innerHTML = items.map(a => `
      <div class="approval-card" id="card-${a.id}">
        <div class="info">
          <strong>${esc(a.api_key_label)}</strong>
          <small>requested ${esc(a.requested_at)} · expires ${esc(a.expires_at)}</small>
        </div>
        <div class="approval-actions-col">
          <div class="emoji-picker" id="picker-${a.id}" data-id="${a.id}" data-expected="${esc(a.emoji_sequence)}">
            <div class="emoji-pinned" id="pinned-${a.id}"></div>
            <input class="emoji-search" type="text" placeholder="Search emoji…"
                   oninput="searchEmoji(this, '${a.id}')"
                   onfocus="searchEmoji(this, '${a.id}')" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('confirm-${a.id}').click();}">
            <div class="emoji-results hidden" id="results-${a.id}"></div>
            <div class="approval-btns">
              <button class="btn-approve" id="confirm-${a.id}" disabled
                      onclick="confirmApprove('${a.id}')">Confirm</button>
              <button class="btn-reject" onclick="rejectApproval('${a.id}')">Reject</button>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  function searchEmoji(input, id) {
    const q = input.value.trim();
    const results = document.getElementById('results-' + id);

    // If input is entirely recognized emojis, auto-pin them (handles copy-paste)
    const emojiSet = new Set(EMOJI_DATA.map(d => d.e));
    const chars = [...q];
    if (chars.length >= 1 && chars.length <= 3 && chars.every(c => emojiSet.has(c))) {
      const pinned = getPinned(id);
      for (const emoji of chars) {
        if (pinned.length < 3) pinned.push(emoji);
      }
      savePinned(id, pinned);
      input.value = '';
      results.classList.add('hidden');
      renderPinned(id, pinned);
      updateConfirmBtn(id, pinned);
      input.focus();
      return;
    }

    const ql = q.toLowerCase();
    const filtered = ql
      ? EMOJI_DATA.filter(d => d.n.includes(ql))
      : EMOJI_DATA;

    if (!filtered.length) {
      results.innerHTML = '<span style="color:#666;font-size:12px;padding:4px;">No match</span>';
    } else {
      results.innerHTML = filtered.map(d =>
        `<button class="emoji-opt" title="${esc(d.n)}" onclick="pinEmoji('${d.e}','${id}')">${d.e}</button>`
      ).join('');
    }
    results.classList.remove('hidden');
  }

  function pinEmoji(emoji, id) {
    const pinned = getPinned(id);

    if (pinned.length >= 3) return; // always 3
    pinned.push(emoji);
    savePinned(id, pinned);

    // clear search
    const input = document.getElementById('picker-' + id).querySelector('.emoji-search');
    input.value = '';
    document.getElementById('results-' + id).classList.add('hidden');
    input.focus();

    renderPinned(id, pinned);
    updateConfirmBtn(id, pinned);
  }

  function renderPinned(id, pinned) {
    const el = document.getElementById('pinned-' + id);
    el.innerHTML = pinned.map((e, i) => {
      const name = (EMOJI_DATA.find(d => d.e === e) || {}).n || '';
      return `<span class="pinned-chip"><span class="pinned-chip-top">${e}<button onclick="unpinEmoji(${i},'${id}')" title="Remove">×</button></span><span class="pinned-chip-name">• ${esc(name)}</span></span>`;
    }).join('');
    // show placeholder slots
    for (let i = pinned.length; i < 3; i++) {
      el.innerHTML += `<span class="pinned-slot">${i + 1}</span>`;
    }
  }

  function unpinEmoji(idx, id) {
    const pinned = getPinned(id);
    pinned.splice(idx, 1);
    savePinned(id, pinned);
    renderPinned(id, pinned);
    updateConfirmBtn(id, pinned);
  }

  function updateConfirmBtn(id, pinned) {
    document.getElementById('confirm-' + id).disabled = pinned.length !== 3;
  }

  function getPinned(id) {
    return window['_pinned_' + id] || [];
  }
  function savePinned(id, arr) {
    window['_pinned_' + id] = arr;
  }

  async function confirmApprove(id) {
    const pinned = getPinned(id);
    if (pinned.length !== 3) return;

    const resp = await fetch('/api/admin/approvals/' + id + '/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm: pinned.join('') }),
    });

    const card = document.getElementById('card-' + id);
    if (resp.ok) {
      card.style.opacity = '0.5';
      card.innerHTML = '<div style="padding:0.5rem;color:#86efac;">✓ Approved</div>';
      setTimeout(() => card.remove(), 1500);
    } else {
      const body = await resp.json().catch(() => null);
      const msg = body?.error || 'Failed to approve';
      card.querySelector('.btn-approve').insertAdjacentHTML('afterend',
        `<span style="color:#fca5a5;font-size:12px;margin-left:0.5rem;">${esc(msg)}</span>`);
    }
  }

  async function rejectApproval(id) {
    const resp = await fetch('/api/admin/approvals/' + id + '/reject', { method: 'POST' });
    const card = document.getElementById('card-' + id);
    if (resp.ok) {
      card.style.opacity = '0.5';
      card.innerHTML = '<div style="padding:0.5rem;color:#fca5a5;">✗ Rejected</div>';
      setTimeout(() => card.remove(), 1500);
    }
  }


  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── Faux approvals (bypass notices) ────────────────────────────────────
  async function loadFauxApprovals() {
    const resp = await fetch('/api/admin/faux-approvals');
    if (!resp.ok) return;
    renderFauxApprovals(await resp.json());
  }

  function renderFauxApprovals(items) {
    const el = document.getElementById('faux-approvals-list');
    if (!items.length) {
      document.getElementById('notices-section').style.display = 'none';
      return;
    }
    document.getElementById('notices-section').style.display = '';
    el.innerHTML = items.map(a => `
      <div class="approval-card" id="faux-${esc(a.id)}" style="border-left:3px solid #713f12;">
        <div class="info">
          <span>${esc(a.message)}</span>
          <small>${esc(a.created_at)}</small>
        </div>
        <div class="approval-actions-col">
          <button class="btn-approve" onclick="dismissFauxApproval('${esc(a.id)}')">OK</button>
        </div>
      </div>`).join('');
  }

  async function dismissFauxApproval(id) {
    const resp = await fetch('/api/admin/faux-approvals/' + encodeURIComponent(id), { method: 'DELETE' });
    if (resp.ok) {
      const card = document.getElementById('faux-' + id);
      if (card) {
        card.style.opacity = '0.5';
        setTimeout(() => { card.remove(); loadFauxApprovals(); }, 400);
      }
    }
  }

  loadFauxApprovals();
</script>
