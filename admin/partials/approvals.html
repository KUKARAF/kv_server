<section>
  <h2>Pending Approvals</h2>
  <p>Compare the emoji shown here with what the requester sees. If they match, approve.</p>

  <div id="approvals-list"
       hx-get="/api/admin/approvals"
       hx-trigger="load, every 30s"
       hx-swap="innerHTML">
    Loading...
  </div>
</section>

<section style="margin-top:2rem;">
  <h2>Auth Phone</h2>
  <p>Generate a QR code to authorise the KV Approver app on a new device.</p>

  <button type="button" class="btn-secondary" onclick="addPhone()">Add phone</button>

  <div id="phone-qr-reveal" class="share-reveal hidden" style="margin-top:1rem;">
    <div class="share-reveal-header">
      <span>📱 Scan with KV Approver app</span>
      <button type="button" class="btn-icon" onclick="closePhoneQr()">✕</button>
    </div>
    <p class="share-reveal-warn">Valid for <strong>180 days</strong>. Scan once — navigating away loses the code.</p>
    <div style="display:flex;justify-content:center;padding:1rem;">
      <canvas id="phone-qr-canvas"></canvas>
    </div>
  </div>
</section>

<template id="approvals-tmpl"></template>

<script>
  document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.pathInfo?.requestPath === '/api/admin/approvals') {
      renderApprovals(e.detail.xhr.response);
    }
  });

  function renderApprovals(json) {
    const items = JSON.parse(json);
    const el = document.getElementById('approvals-list');
    if (!items.length) { el.innerHTML = '<p>No pending approvals.</p>'; return; }
    el.innerHTML = items.map(a => `
      <div class="approval-card">
        <div class="emoji">${a.emoji_sequence}</div>
        <div class="info">
          <strong>${esc(a.api_key_label)}</strong>
          <small>requested ${esc(a.requested_at)} · expires ${esc(a.expires_at)}</small>
        </div>
        <div class="actions">
          <button class="btn-approve"
                  hx-post="/api/admin/approvals/${a.id}/approve"
                  hx-target="#approvals-list"
                  hx-swap="innerHTML">Approve</button>
          <button class="btn-reject"
                  hx-post="/api/admin/approvals/${a.id}/reject"
                  hx-target="#approvals-list"
                  hx-swap="innerHTML">Reject</button>
        </div>
      </div>`).join('');
  }

  async function addPhone() {
    const resp = await fetch('/api/admin/session/device-token', { method: 'POST' });
    if (!resp.ok) { alert('Failed to generate token: ' + resp.status); return; }
    const token = await resp.json();

    const canvas = document.getElementById('phone-qr-canvas');
    // Clear previous QR if any
    const parent = canvas.parentElement;
    const fresh = document.createElement('canvas');
    fresh.id = 'phone-qr-canvas';
    parent.replaceChild(fresh, canvas);

    new QRCode(fresh, { text: token, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
    document.getElementById('phone-qr-reveal').classList.remove('hidden');
  }

  function closePhoneQr() {
    document.getElementById('phone-qr-reveal').classList.add('hidden');
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
