<section>
  <h2>KV Entries</h2>

  <datalist id="scopes-list"></datalist>

  <form id="add-entry-form" onsubmit="return addEntry(event)" class="panel">
    <h3>Add / update entry</h3>
    <div class="form-row-2">
      <label>Key <input name="key" required placeholder="DATABASE_URL"></label>
      <label>Scope <input name="scope" list="scopes-list" placeholder="osmosis/deployment"></label>
    </div>
    <label>Value <textarea name="value" required rows="2" placeholder="the value…"></textarea></label>
    <div class="form-inline">
      <label>TTL (h) <input name="ttl_hours" type="number" step="0.1" min="0" placeholder="—" class="input-sm"></label>
      <label class="label-check"><input name="ttl_sliding" type="checkbox"> Sliding</label>
      <label class="label-check"><input name="open_access" type="checkbox"> Open access</label>
      <label class="label-check"><input name="one_time" type="checkbox" onchange="toggleOneTime(this)"> One-time</label>
      <label class="label-check"><input name="approval_required" type="checkbox" onchange="toggleApprovalRequired(this)"> Approval required</label>
      <label class="label-check"><input name="zero_trust" type="checkbox" onchange="toggleZeroTrust(this)"> Zero Trust</label>
      <button type="submit">Save</button>
    </div>
  </form>

  <!-- Share reveal (one-time and approval-required) -->
  <div id="share-reveal" class="share-reveal hidden">
    <div class="share-reveal-header">
      <span id="share-reveal-title">🔐 One-time share link generated</span>
      <button type="button" class="btn-icon" onclick="document.getElementById('share-reveal').classList.add('hidden')">✕</button>
    </div>
    <p id="share-reveal-warn" class="share-reveal-warn">This link can only be used <strong>once</strong>. The value will be gone after retrieval.</p>
    <div id="share-reveal-emoji" style="font-size:2.5rem;margin-bottom:.5rem;display:none;"></div>
    <div class="share-reveal-url">
      <code id="share-url"></code>
      <button type="button" class="btn-secondary" onclick="copyShareUrl()">Copy</button>
      <a id="share-open" href="#" target="_blank" class="btn">Open</a>
    </div>
  </div>

  <form id="import-env-form" onsubmit="return importEnv(event)" class="panel">
    <h3>Import .env</h3>
    <div class="form-row-2">
      <label>File <input name="file" type="file" accept=".env,text/plain"></label>
      <label>Scope <input name="scope" list="scopes-list" placeholder="osmosis/deployment"></label>
    </div>
    <label>or paste <textarea name="content" rows="3" placeholder="KEY=value&#10;ANOTHER=value"></textarea></label>
    <div class="form-inline">
      <label>Key prefix <input name="prefix" placeholder="myapp/" class="input-sm"></label>
      <label>TTL (h) <input name="ttl_hours" type="number" step="0.1" min="0" placeholder="—" class="input-sm"></label>
      <label class="label-check"><input name="open_access" type="checkbox"> Open access</label>
      <button type="submit">Import</button>
    </div>
    <div id="import-result" class="result-msg"></div>
  </form>

  <div class="filter-bar">
    <form hx-get="/api/admin/kv" hx-target="#entries-list" hx-swap="none"
          hx-trigger="submit, load" class="form-inline">
      <input name="prefix" placeholder="Filter by prefix">
      <button type="submit">Search</button>
    </form>
  </div>

  <div id="entries-list">Loading…</div>
</section>

<script>
  function toggleOneTime(cb) {
    const form = cb.closest('form');
    if (cb.checked) {
      form.querySelector('[name=open_access]').checked = false;
      form.querySelector('[name=open_access]').disabled = true;
      form.querySelector('[name=ttl_sliding]').checked = false;
      form.querySelector('[name=ttl_sliding]').disabled = true;
      form.querySelector('[name=approval_required]').checked = false;
      form.querySelector('[name=approval_required]').disabled = true;
    } else {
      form.querySelector('[name=open_access]').disabled = false;
      form.querySelector('[name=ttl_sliding]').disabled = false;
      form.querySelector('[name=approval_required]').disabled = false;
    }
  }

  function toggleApprovalRequired(cb) {
    const form = cb.closest('form');
    if (cb.checked) {
      form.querySelector('[name=open_access]').checked = false;
      form.querySelector('[name=open_access]').disabled = true;
      form.querySelector('[name=one_time]').checked = false;
      form.querySelector('[name=one_time]').disabled = true;
      form.querySelector('[name=ttl_sliding]').checked = false;
      form.querySelector('[name=ttl_sliding]').disabled = true;
    } else {
      form.querySelector('[name=open_access]').disabled = false;
      form.querySelector('[name=one_time]').disabled = false;
      form.querySelector('[name=ttl_sliding]').disabled = false;
    }
  }

  function toggleZeroTrust(cb) {
    const form = cb.closest('form');
    const others = ['open_access', 'ttl_sliding', 'one_time', 'approval_required'];
    if (cb.checked) {
      others.forEach(n => {
        form.querySelector('[name=' + n + ']').checked = false;
        form.querySelector('[name=' + n + ']').disabled = true;
      });
    } else {
      others.forEach(n => { form.querySelector('[name=' + n + ']').disabled = false; });
    }
  }

  async function loadScopes() {
    const resp = await fetch('/api/admin/kv/scopes');
    if (!resp.ok) return;
    const scopes = await resp.json();
    const dl = document.getElementById('scopes-list');
    dl.innerHTML = scopes.map(s => `<option value="${esc(s)}">`).join('');
  }
  loadScopes();

  async function addEntry(e) {
    e.preventDefault();
    const form = e.target;
    const key = form.key.value.trim();
    const ttlRaw = form.ttl_hours.value.trim();
    const oneTime = form.one_time.checked;
    const approvalRequired = form.approval_required.checked;
    const zeroTrust = form.zero_trust.checked;

    if (zeroTrust) {
      // Generate a fresh PRF salt client-side
      const prfSaltBytes = crypto.getRandomValues(new Uint8Array(32));
      const prfSaltB64 = b64uEncode(prfSaltBytes);

      // Get WebAuthn PRF challenge from server
      const challResp = await fetch('/api/admin/webauthn/challenge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prf_salt: prfSaltB64 }),
      });
      if (!challResp.ok) { alert('Failed to get ZT challenge: ' + challResp.status); return false; }
      const { options } = await challResp.json();

      // Run WebAuthn ceremony — PRF extension evaluates here in the browser
      let assertion;
      try {
        assertion = await navigator.credentials.get({ publicKey: decodeWebAuthnOptions(options.publicKey) });
      } catch (e) {
        alert('Hardware key cancelled or failed: ' + e.message);
        return false;
      }

      const prfOutput = assertion.getClientExtensionResults?.()?.prf?.results?.first;
      if (!prfOutput) {
        alert('Hardware key did not return PRF output. Ensure your key supports the PRF extension.');
        return false;
      }

      // Wrap a fresh DEK with the PRF-derived AES-KW key
      const wrapKey = await crypto.subtle.importKey('raw', prfOutput, { name: 'AES-KW' }, false, ['wrapKey']);
      const dek = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
      const nonce = crypto.getRandomValues(new Uint8Array(12));
      const aad = 'zt:' + key;
      const encoder = new TextEncoder();
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: nonce, additionalData: encoder.encode(aad) },
        dek,
        encoder.encode(form.value.value)
      );
      const wrappedDek = await crypto.subtle.wrapKey('raw', dek, wrapKey, 'AES-KW');
      const credentialId = b64uEncode(new Uint8Array(assertion.rawId));

      const saveResp = await fetch('/api/admin/kv', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          key,
          value: '',
          scope: form.scope.value.trim() || null,
          ttl_hours: ttlRaw ? parseFloat(ttlRaw) : null,
          ttl_sliding: false,
          open_access: false,
          zt_ciphertext:    b64uEncode(new Uint8Array(ciphertext)),
          zt_wrapped_dek:   b64uEncode(new Uint8Array(wrappedDek)),
          zt_nonce:         b64uEncode(nonce),
          zt_aad:           aad,
          zt_credential_id: credentialId,
          zt_prf_salt:      prfSaltB64,
        }),
      });
      if (!saveResp.ok) { alert('Error saving ZT entry: ' + saveResp.status); return false; }

      const keyResp = await fetch('/api/admin/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          label: 'zt:' + key,
          key_type: 'zero_trust',
          expires_at: null,
          scopes: [{ key_pattern: key, ops: 'read' }],
        }),
      });
      if (!keyResp.ok) {
        alert('Entry saved but failed to create ZT key: ' + keyResp.status);
      } else {
        const { key: shareToken } = await keyResp.json();
        const shareUrl = location.origin + '/share?key=' + encodeURIComponent(key) + '&token=' + encodeURIComponent(shareToken);
        document.getElementById('share-reveal-title').textContent = '🔒 Zero Trust share link';
        document.getElementById('share-reveal-warn').style.display = 'none';
        document.getElementById('share-reveal-emoji').style.display = 'none';
        document.getElementById('share-url').textContent = shareUrl;
        document.getElementById('share-open').href = shareUrl;
        document.getElementById('share-reveal').classList.remove('hidden');
      }

      form.reset();
      ['open_access', 'ttl_sliding', 'one_time', 'approval_required', 'zero_trust'].forEach(n => {
        form.querySelector('[name=' + n + ']').disabled = false;
      });
      loadScopes();
      htmx.trigger(document.querySelector('[hx-get="/api/admin/kv"]'), 'submit');
      return false;
    }

    const body = {
      key,
      value: form.value.value,
      scope: form.scope.value.trim() || null,
      ttl_hours: ttlRaw ? parseFloat(ttlRaw) : null,
      ttl_sliding: form.ttl_sliding.checked,
      open_access: form.open_access.checked,
    };

    const resp = await fetch('/api/admin/kv', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) { alert('Error saving entry: ' + resp.status); return false; }

    if (oneTime) {
      const keyResp = await fetch('/api/admin/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          label: 'one-time:' + key,
          key_type: 'one_time',
          expires_at: null,
          scopes: [{ key_pattern: key, ops: 'read' }],
        }),
      });
      if (!keyResp.ok) { alert('Entry saved but failed to create share key: ' + keyResp.status); }
      else {
        const { key: token } = await keyResp.json();
        const shareUrl = location.origin + '/share?key=' + encodeURIComponent(key) + '&token=' + encodeURIComponent(token);
        document.getElementById('share-reveal-title').textContent = '🔐 One-time share link generated';
        document.getElementById('share-reveal-warn').style.display = '';
        document.getElementById('share-reveal-emoji').style.display = 'none';
        document.getElementById('share-url').textContent = shareUrl;
        document.getElementById('share-open').href = shareUrl;
        document.getElementById('share-reveal').classList.remove('hidden');
      }
    } else if (approvalRequired) {
      const keyResp = await fetch('/api/admin/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          label: 'approval:' + key,
          key_type: 'approval_required',
          expires_at: null,
          scopes: [{ key_pattern: key, ops: 'read' }],
        }),
      });
      if (!keyResp.ok) { alert('Entry saved but failed to create approval key: ' + keyResp.status); }
      else {
        const { key: token } = await keyResp.json();
        const shareUrl = location.origin + '/share?key=' + encodeURIComponent(key) + '&token=' + encodeURIComponent(token);
        document.getElementById('share-reveal-title').textContent = '🔑 Approval-required share link';
        document.getElementById('share-reveal-warn').style.display = 'none';
        document.getElementById('share-reveal-emoji').style.display = 'none';
        document.getElementById('share-url').textContent = shareUrl;
        document.getElementById('share-open').href = shareUrl;
        document.getElementById('share-reveal').classList.remove('hidden');
      }
    }

    form.reset();
    // Re-enable any fields that were disabled by checkbox toggles
    ['open_access', 'ttl_sliding', 'one_time', 'approval_required', 'zero_trust'].forEach(n => {
      form.querySelector('[name=' + n + ']').disabled = false;
    });
    loadScopes();
    htmx.trigger(document.querySelector('[hx-get="/api/admin/kv"]'), 'submit');
    return false;
  }

  function copyShareUrl() {
    navigator.clipboard.writeText(document.getElementById('share-url').textContent);
  }

  async function importEnv(e) {
    e.preventDefault();
    const form = e.target;
    let content = form.content.value;
    const file = form.file.files[0];
    if (file) content = await file.text();
    if (!content.trim()) { alert('Provide a file or paste content.'); return false; }

    const ttlRaw = form.ttl_hours.value.trim();
    const body = {
      content,
      prefix: form.prefix.value || null,
      scope: form.scope.value.trim() || null,
      ttl_hours: ttlRaw ? parseFloat(ttlRaw) : null,
      ttl_sliding: false,
      open_access: form.open_access.checked,
    };
    const resp = await fetch('/api/admin/kv/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) { alert('Error: ' + resp.status); return false; }
    const data = await resp.json();
    document.getElementById('import-result').textContent =
      `Imported ${data.imported} entries (${data.skipped} skipped).`;
    form.reset();
    loadScopes();
    htmx.trigger(document.querySelector('[hx-get="/api/admin/kv"]'), 'submit');
    return false;
  }

  async function deleteEntry(key) {
    if (!confirm(`Delete "${key}"?`)) return;
    const resp = await fetch('/api/admin/kv/' + encodeURIComponent(key), { method: 'DELETE' });
    if (!resp.ok) { alert('Error deleting: ' + resp.status); return; }
    htmx.trigger(document.querySelector('[hx-get="/api/admin/kv"]'), 'submit');
  }

  async function saveScope(key, value) {
    await fetch('/api/admin/kv/' + encodeURIComponent(key), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scope: value || null }),
    });
    loadScopes();
  }

  document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.pathInfo?.requestPath?.startsWith('/api/admin/kv')) {
      try { renderEntries(e.detail.xhr.response); } catch {}
    }
  });

  function renderEntries(json) {
    const entries = JSON.parse(json);
    const el = document.getElementById('entries-list');
    if (!entries.length) { el.innerHTML = '<p>No entries found.</p>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Key</th><th>Scope</th><th>TTL (h)</th><th>Sliding</th><th>Open</th><th>Expires</th><th>Created</th><th></th></tr></thead>
      <tbody>${entries.map(e => `
        <tr>
          <td><code>${esc(e.key)}</code></td>
          <td><span class="scope-cell" data-key="${esc(e.key)}" onclick="editScope(this)">${e.scope ? `<span class="badge badge-scope">${esc(e.scope)}</span>` : '<span class="scope-empty">+ scope</span>'}</span></td>
          <td>${e.ttl_hours ?? '—'}</td>
          <td>${e.ttl_sliding ? '✓' : '—'}</td>
          <td>${e.open_access ? '✓' : '—'}</td>
          <td>${e.expires_at ? esc(e.expires_at) : '—'}</td>
          <td>${esc(e.created_at)}</td>
          <td><button class="btn-icon" onclick="deleteEntry('${esc(e.key)}')" title="Delete">🗑️</button></td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  function editScope(cell) {
    const key = cell.dataset.key;
    const current = cell.querySelector('.badge-scope')?.textContent ?? '';
    cell.innerHTML = `<input class="scope-input" list="scopes-list" value="${esc(current)}" placeholder="scope…">`;
    const input = cell.querySelector('input');
    input.focus();
    input.select();
    const commit = async () => {
      const val = input.value.trim();
      await saveScope(key, val);
      htmx.trigger(document.querySelector('[hx-get="/api/admin/kv"]'), 'submit');
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { input.removeEventListener('blur', commit); htmx.trigger(document.querySelector('[hx-get="/api/admin/kv"]'), 'submit'); }
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /** Encode Uint8Array or ArrayBuffer to base64url */
  function b64uEncode(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  }

  /** Decode base64url string to ArrayBuffer */
  function b64uDecode(s) {
    const padded = s.replace(/-/g, '+').replace(/_/g, '/').padEnd(s.length + (4 - s.length % 4) % 4, '=');
    const bin = atob(padded);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf.buffer;
  }

  /** Decode WebAuthn get options: convert base64url fields to ArrayBuffer */
  function decodeWebAuthnOptions(pk) {
    const out = { ...pk };
    if (pk.challenge) out.challenge = b64uDecode(pk.challenge);
    if (pk.allowCredentials) out.allowCredentials = pk.allowCredentials.map(c => ({ ...c, id: b64uDecode(c.id) }));
    return out;
  }
</script>
