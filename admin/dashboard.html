<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <title>Admin — kv.osmosis.page</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="/admin/js/utils.js"></script>
  <link rel="stylesheet" href="/admin/style.css">
  <script defer src="https://analytics.osmosis.page/script.js" data-website-id="9fba5aab-afb5-42e5-b84e-799a84a3a6a8"></script>
</head>
<body>
  <nav>
    <a href="/admin/dashboard.html" class="brand"><img src="https://static.osmosis.page/kv/kv_logo.svg" alt="KV Manager" class="brand-logo"></a>
    <button onclick="showTab('keys')" class="tab-btn" id="tab-keys">API Keys</button>
    <button onclick="showTab('approvals')" class="tab-btn" id="tab-approvals">Approvals</button>
    <button onclick="showTab('devices')" class="tab-btn" id="tab-devices">Devices</button>
    <button onclick="showTab('entries')" class="tab-btn" id="tab-entries">KV Entries</button>
    <button onclick="showTab('zero-trust')" class="tab-btn" id="tab-zero-trust">Zero Trust</button>
    <button onclick="showTab('management-keys')" class="tab-btn" id="tab-management-keys">Management Keys</button>
    <button onclick="showTab('rate-limits')" class="tab-btn" id="tab-rate-limits">Rate Limits</button>
    <button onclick="showTab('session')" class="tab-btn" id="tab-session">Session</button>
    <button onclick="copySession()" class="tab-btn" title="Copy session token">📋</button>
    <button onclick="deleteRevokedSessions()" class="tab-btn btn-danger" title="Delete all revoked session keys">Purge revoked</button>
    <span class="nav-spacer"></span>
    <span id="nav-user" class="nav-user"></span>
    <button onclick="logout()" class="tab-btn nav-logout">Logout</button>
  </nav>

  <main>
    <div id="tab-keys-content" class="tab-content">
      <div hx-get="/admin/partials/api-keys.html" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div id="tab-approvals-content" class="tab-content hidden">
      <div hx-get="/admin/partials/approvals.html" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div id="tab-devices-content" class="tab-content hidden">
      <div hx-get="/admin/partials/device-auth.html" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div id="tab-entries-content" class="tab-content hidden">
      <div hx-get="/admin/partials/kv-entries.html" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div id="tab-zero-trust-content" class="tab-content hidden">
      <div hx-get="/admin/partials/zero-trust.html" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div id="tab-management-keys-content" class="tab-content hidden">
      <div hx-get="/admin/partials/management-keys.html" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div id="tab-rate-limits-content" class="tab-content hidden">
      <div hx-get="/admin/partials/rate-limits.html" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div id="tab-session-content" class="tab-content hidden">
      <div hx-get="/admin/partials/session.html" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
  </main>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script>
    // ── Auth guard ──────────────────────────────────────────────────────────
    function handleUnauthorized() {
      window.location.href = '/auth/login';
    }

    // Intercept all fetch() calls — redirect on 401
    const _fetch = window.fetch;
    window.fetch = async (...args) => {
      const resp = await _fetch(...args);
      if (resp.status === 401) { handleUnauthorized(); }
      return resp;
    };

    // Intercept HTMX requests — redirect on 401
    document.addEventListener('htmx:responseError', e => {
      if (e.detail.xhr.status === 401) handleUnauthorized();
    });

    // ── Tabs ────────────────────────────────────────────────────────────────
    function showTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name + '-content').classList.remove('hidden');
      document.getElementById('tab-' + name).classList.add('active');
    }
    showTab('keys');

    // ── Toast system ────────────────────────────────────────────────────────
    const activeToasts = new Map(); // id → element

    function showToast(msg, { id = null, persistent = false, type = 'info' } = {}) {
      // Reuse existing toast with same id
      if (id && activeToasts.has(id)) return activeToasts.get(id);

      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span>${msg}</span>${persistent ? `<button onclick="dismissToast('${id || ''}', this)">✕</button>` : ''}`;
      document.getElementById('toast-container').appendChild(el);

      // Animate in
      requestAnimationFrame(() => el.classList.add('toast-show'));

      if (id) activeToasts.set(id, el);

      if (!persistent) {
        setTimeout(() => removeToast(el, id), 3000);
      }
      return el;
    }

    function removeToast(el, id = null) {
      el.classList.remove('toast-show');
      el.addEventListener('transitionend', () => el.remove(), { once: true });
      if (id) activeToasts.delete(id);
    }

    function dismissToast(id, btn) {
      if (id && activeToasts.has(id)) {
        removeToast(activeToasts.get(id), id);
      } else {
        removeToast(btn.closest('.toast'));
      }
    }

    // ── Nav user info ────────────────────────────────────────────────────────
    async function loadNavUser() {
      const resp = await fetch('/api/admin/session');
      if (!resp.ok) return;
      const s = await resp.json();
      document.getElementById('nav-user').textContent = s.email;
    }
    loadNavUser();

    // ── IndexedDB helpers (shared with device-registration.html) ─────────────
    const _IDB_NAME  = 'kv_manager';
    const _IDB_STORE = 'kv_device';

    function _openAdminDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(_IDB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(_IDB_STORE);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    function _dbGet(db, key) {
      return new Promise((resolve, reject) => {
        const req = db.transaction(_IDB_STORE, 'readonly').objectStore(_IDB_STORE).get(key);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    async function _dbPut(db, key, value) {
      return new Promise((resolve, reject) => {
        const req = db.transaction(_IDB_STORE, 'readwrite').objectStore(_IDB_STORE).put(value, key);
        req.onsuccess = () => resolve();
        req.onerror   = e => reject(e.target.error);
      });
    }

    async function _dbClear(db) {
      return new Promise((resolve, reject) => {
        const req = db.transaction(_IDB_STORE, 'readwrite').objectStore(_IDB_STORE).clear();
        req.onsuccess = () => resolve();
        req.onerror   = e => reject(e.target.error);
      });
    }

    function _showStaleDeviceModal(db, record) {
      const overlay = document.createElement('div');
      overlay.id = 'stale-device-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center';
      overlay.innerHTML = `
        <div style="background:#1a1a2e;border:2px solid #ff6b35;padding:2rem;max-width:480px;width:90%;font-family:var(--font-mono,monospace)">
          <h2 style="color:#ff6b35;margin:0 0 1rem;font-size:1rem">⚠ Stale Device Registration</h2>
          <p style="color:#ccc;font-size:.85rem;margin:0 0 1.5rem">
            This browser has a saved device key, but that device is no longer registered on the server
            (it may have been deleted or registered from another browser).
          </p>
          <p style="color:#ccc;font-size:.85rem;margin:0 0 1.5rem">Choose how to proceed:</p>
          <div style="display:flex;flex-direction:column;gap:.75rem">
            <div style="display:flex;flex-direction:column;gap:.4rem">
              <label style="color:#aaa;font-size:.75rem">Device name (for re-enroll)</label>
              <input id="stale-device-name" type="text" placeholder="e.g. Rafał's browser"
                style="padding:.4rem .6rem;background:#0a0a1a;color:#fff;border:1px solid #4a9eff;font-size:.8rem;width:100%;box-sizing:border-box">
            </div>
            <button id="stale-reenroll" style="padding:.6rem 1rem;background:#0f3460;color:#fff;border:1px solid #4a9eff;cursor:pointer;font-size:.8rem">
              Re-enroll existing key — keep this browser's private key, re-register it on the server
            </button>
            <button id="stale-reregister" style="padding:.6rem 1rem;background:#2d1b1b;color:#fff;border:1px solid #ff6b35;cursor:pointer;font-size:.8rem">
              Delete &amp; re-register — generate a fresh key pair
            </button>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      document.getElementById('stale-reregister').onclick = async () => {
        await _dbClear(db);
        window.location.href = '/admin/device-registration.html';
      };

      document.getElementById('stale-reenroll').onclick = async () => {
        try {
          const spki = await crypto.subtle.exportKey('spki', record.publicKey);
          const b64  = btoa(String.fromCharCode(...new Uint8Array(spki)));
          const name = document.getElementById('stale-device-name').value.trim() || 'browser';
          // WebAuthn-gated: prompts for a passkey touch before re-enrolling (see utils.js).
          const data = await enrolDevice(name, b64, 'p256');
          await _dbPut(db, 'device', { ...record, deviceId: data.id });
          overlay.remove();
          showToast('Re-enrolled successfully', { type: 'success' });
        } catch (e) {
          showToast(`Re-enroll error: ${e.message}`, { type: 'error' });
        }
      };
    }

    async function checkDeviceRegistration() {
      try {
        const db     = await _openAdminDB();
        const record = await _dbGet(db, 'device');
        const valid  = record?.deviceId && record?.privateKey?.usages?.includes('deriveBits');
        if (!valid) {
          showToast(
            'This browser is not registered as a device. ' +
            '<a href="/admin/device-registration.html" style="color:#fff;text-decoration:underline">Register now</a> ' +
            'to decrypt device-encrypted secrets.',
            { id: 'device-reg', type: 'info', persistent: true }
          );
          return;
        }
        // Check if the stored deviceId still exists on the server
        const devResp = await fetch('/api/admin/devices');
        if (!devResp.ok) return; // can't verify — skip silently
        const devices = await devResp.json();
        const found = Array.isArray(devices) && devices.some(d => d.id === record.deviceId);
        if (!found) {
          _showStaleDeviceModal(db, record);
        }
      } catch { /* IndexedDB unavailable — skip silently */ }
    }
    checkDeviceRegistration();

    async function logout() {
      await fetch('/api/admin/session/logout', { method: 'POST' });
      window.location.href = '/auth/login';
    }

    // ── Purge revoked session keys ──────────────────────────────────────────
    async function deleteRevokedSessions() {
      if (!confirm('Delete all revoked session keys?')) return;
      const resp = await fetch('/api/admin/keys/revoked-sessions', { method: 'DELETE' });
      if (!resp.ok) { showToast('Failed to purge revoked sessions', { type: 'error' }); return; }
      const data = await resp.json();
      showToast(`Purged ${data.deleted} revoked session key(s)`, { type: 'success' });
    }

    // ── Copy session token ──────────────────────────────────────────────────
    async function copySession() {
      const resp = await fetch('/api/admin/session/token');
      if (!resp.ok) { showToast('Failed to get token', { type: 'error' }); return; }
      const token = await resp.json();
      await navigator.clipboard.writeText(token);
      showToast('Session token copied', { type: 'success' });
    }

    // ── Approval poller ─────────────────────────────────────────────────────
    let knownApprovals = new Set();

    async function pollApprovals() {
      let data;
      try {
        const resp = await fetch('/api/admin/approvals');
        if (!resp.ok) return;
        data = await resp.json();
      } catch { return; }

      const currentIds = new Set(data.map(a => a.id));

      // Show toast for newly appeared approvals
      for (const a of data) {
        if (!knownApprovals.has(a.id)) {
          showToast(
            `🔐 Approval needed: <strong>${a.api_key_label}</strong>`,
            { id: 'approval-' + a.id, persistent: true, type: 'warning' }
          );
        }
      }

      // Dismiss toasts for approvals that are gone
      for (const id of knownApprovals) {
        if (!currentIds.has(id) && activeToasts.has('approval-' + id)) {
          removeToast(activeToasts.get('approval-' + id), 'approval-' + id);
        }
      }

      knownApprovals = currentIds;

      // Pulse the Approvals tab button if any pending
      document.getElementById('tab-approvals').classList.toggle('tab-pulse', data.length > 0);
    }

    pollApprovals();
    setInterval(pollApprovals, 30000);

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ── Session request poller ───────────────────────────────────────────────
    let knownSessionRequests = new Set();

    async function pollSessionRequests() {
      let data;
      try {
        const resp = await fetch('/api/admin/session-requests');
        if (!resp.ok) return;
        data = await resp.json();
      } catch { return; }

      const currentIds = new Set(data.map(r => r.id));

      for (const r of data) {
        if (!knownSessionRequests.has(r.id)) {
          // Show the device's real, registered name — never the request's self-reported
          // label, which is attacker-controlled and not a trust signal.
          const name = r.device_name ? `<strong>${esc(r.device_name)}</strong>` : 'Unknown device';
          showToast(
            `🔐 Session request: ${name} — <a href="/admin/session-request.html?id=${esc(r.id)}" style="color:#93c5fd">Review →</a>` +
            ` (approving requires the link/QR shown by the device itself, not this notification)`,
            { id: 'session-req-' + r.id, persistent: true, type: 'warning' }
          );
        }
      }

      for (const id of knownSessionRequests) {
        if (!currentIds.has(id) && activeToasts.has('session-req-' + id)) {
          removeToast(activeToasts.get('session-req-' + id), 'session-req-' + id);
        }
      }

      knownSessionRequests = currentIds;
    }

    pollSessionRequests();
    setInterval(pollSessionRequests, 30000);

    // ── Device proposal poller ───────────────────────────────────────────────
    let knownDeviceProposals = new Set();

    async function pollDeviceProposals() {
      let data;
      try {
        const resp = await fetch('/api/admin/device-proposals');
        if (!resp.ok) return;
        data = await resp.json();
      } catch { return; }

      const currentIds = new Set(data.map(p => p.id));

      for (const p of data) {
        if (!knownDeviceProposals.has(p.id)) {
          showToast(
            `💻 Device wants to register: <strong>${esc(p.name)}</strong> — <a href="/admin/device-proposal.html?id=${esc(p.id)}" style="color:#93c5fd">Review →</a>` +
            ` (confirming requires the link/QR shown by the device itself, not this notification)`,
            { id: 'device-proposal-' + p.id, persistent: true, type: 'warning' }
          );
        }
      }

      for (const id of knownDeviceProposals) {
        if (!currentIds.has(id) && activeToasts.has('device-proposal-' + id)) {
          removeToast(activeToasts.get('device-proposal-' + id), 'device-proposal-' + id);
        }
      }

      knownDeviceProposals = currentIds;
    }

    pollDeviceProposals();
    setInterval(pollDeviceProposals, 30000);
  </script>
</body>
</html>
