<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approve Session Request — KV Manager</title>
  <link rel="stylesheet" href="/admin/style.css">
  <style>
    .device-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
    }
    .device-icon { font-size: 3rem; text-align: center; margin-bottom: 0.75rem; }
    .device-box h1 { font-size: 1.3rem; text-align: center; margin-bottom: 0.5rem; }
    .device-meta { color: #888; font-size: 12px; text-align: center; margin-bottom: 1.5rem; }
    .countdown { color: #f59e0b; font-weight: 600; }
    .action-row { display: flex; gap: 0.75rem; margin-top: 1.5rem; justify-content: flex-end; }
    .btn-danger { background: #dc2626; color: #fff; padding: 0.4rem 1rem; border-radius: 5px; border: none; cursor: pointer; font-size: 13px; }
    .btn-danger:hover { background: #b91c1c; }
    .status-msg { text-align: center; padding: 2rem; }
    .status-msg .status-icon { font-size: 3rem; margin-bottom: 1rem; }
    .open-in-app { display: block; text-align: center; margin-top: 1rem; color: #93c5fd; font-size: 13px; }
  </style>
</head>
<body class="login-page">
  <div class="device-box">
    <div class="share-brand"><img src="https://static.layer55.eu/kv/kv_logo.svg" alt="KV Manager" class="share-brand-logo"></div>

    <div id="loading">
      <div class="device-icon">⏳</div>
      <h1>Loading…</h1>
    </div>

    <div id="status-view" class="hidden">
      <div class="status-msg">
        <div class="status-icon" id="status-icon"></div>
        <p id="status-text"></p>
      </div>
    </div>

    <div id="approve-view" class="hidden">
      <div class="device-icon">🔑</div>
      <h1>Session requested</h1>
      <p id="request-label" class="device-meta" style="font-size:14px;color:#e0e0e0;margin-bottom:0.25rem;"></p>
      <p class="device-meta">
        Requested <span id="requested-at"></span> &nbsp;·&nbsp;
        Expires in <span id="countdown" class="countdown"></span>
      </p>

      <p style="color:#888;font-size:13px;line-height:1.5;">
        Approving will create a 15-hour session token for this client.
      </p>

      <div class="action-row">
        <button class="btn-danger" onclick="rejectRequest()">Reject</button>
        <button class="btn" onclick="approveRequest()">Approve</button>
      </div>
    </div>
  </div>

  <script>
    // ── Auth guard ────────────────────────────────────────────────────────────
    const _fetch = window.fetch;
    window.fetch = async (...args) => {
      const resp = await _fetch(...args);
      if (resp.status === 401) { window.location.href = '/auth/login?return=' + encodeURIComponent(location.href); }
      return resp;
    };

    // ── Init ──────────────────────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const requestId = params.get('id');

    if (!requestId) {
      showStatus('❌', 'No request ID provided.');
    } else {
      loadRequest();
    }

    async function loadRequest() {
      const resp = await fetch('/api/admin/session-requests/' + requestId);
      if (resp.status === 404) { showStatus('❌', 'Request not found.'); return; }
      if (!resp.ok) { showStatus('❌', 'Failed to load request (' + resp.status + ').'); return; }

      const data = await resp.json();

      if (data.status !== 'pending') {
        const msgs = {
          approved:  ['✅', 'This request has already been approved.'],
          rejected:  ['✗', 'This request was rejected.'],
          expired:   ['⏰', 'This request has expired.'],
          delivered: ['✅', 'This request was approved and the session was delivered.'],
        };
        const [icon, text] = msgs[data.status] || ['?', 'Unknown status: ' + data.status];
        showStatus(icon, text);
        return;
      }

      if (data.label) {
        document.getElementById('request-label').textContent = data.label;
      }
      document.getElementById('requested-at').textContent = data.requested_at;
      startCountdown(data.expires_at);

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('approve-view').classList.remove('hidden');

      // Deep link for KV Approver Android app
      const appLink = document.createElement('a');
      appLink.href = 'kvapp://session-request?id=' + encodeURIComponent(requestId);
      appLink.className = 'open-in-app';
      appLink.textContent = 'Open in KV Approver app →';
      document.getElementById('approve-view').appendChild(appLink);
    }

    function showStatus(icon, text) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('status-icon').textContent = icon;
      document.getElementById('status-text').textContent = text;
      document.getElementById('status-view').classList.remove('hidden');
    }

    // ── Countdown ─────────────────────────────────────────────────────────────
    function startCountdown(expiresAt) {
      const el = document.getElementById('countdown');
      function tick() {
        const diff = Math.max(0, new Date(expiresAt + 'Z') - Date.now());
        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = m + ':' + String(s).padStart(2, '0');
        if (diff <= 0) { showStatus('⏰', 'This request has expired.'); }
      }
      tick();
      setInterval(tick, 1000);
    }

    // ── Approve / Reject ──────────────────────────────────────────────────────
    async function approveRequest() {
      const resp = await fetch('/api/admin/session-requests/' + requestId + '/approve', {
        method: 'POST',
      });
      if (resp.ok) {
        showStatus('✅', 'Approved! The session token has been sent to the client.');
      } else {
        showStatus('❌', 'Approval failed (' + resp.status + ').');
      }
    }

    async function rejectRequest() {
      const resp = await fetch('/api/admin/session-requests/' + requestId + '/reject', { method: 'POST' });
      if (resp.ok) {
        showStatus('✗', 'Request rejected.');
      } else {
        showStatus('❌', 'Rejection failed (' + resp.status + ').');
      }
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
