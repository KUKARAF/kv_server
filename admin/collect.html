<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <title>Provide secrets — kv.osmosis.page</title>
  <link rel="stylesheet" href="/admin/style.css">
  <script defer src="https://analytics.osmosis.page/script.js" data-website-id="9fba5aab-afb5-42e5-b84e-799a84a3a6a8"></script>
  <style>
    .collect-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 580px;
      width: 100%;
    }
    .collect-icon { font-size: 3rem; margin-bottom: 0.75rem; text-align: center; }
    .collect-box h1 { font-size: 1.3rem; margin-bottom: 0.5rem; text-align: center; }
    .collect-desc { color: #aaa; font-size: 13px; margin-bottom: 1.5rem; line-height: 1.6; text-align: center; }
    .kv-pairs { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem; }
    .kv-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.5rem; align-items: center; }
    .kv-row input { margin-top: 0; }
    .kv-row.required-row .kv-key { background: #111; color: #ccc; cursor: default; }
    .kv-row.required-row .kv-key::placeholder { color: #555; }
    .required-badge {
      display: inline-block;
      font-size: 10px;
      background: #450a0a;
      color: #fca5a5;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .bypass-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem;
      align-items: center;
      margin-top: -0.25rem;
      padding: 0 0 0.25rem 0;
    }
    .bypass-row label { font-size: 11px; color: #666; white-space: nowrap; }
    .bypass-row input { font-size: 12px; margin-top: 0; }
    .btn-bypass {
      background: none;
      border: none;
      color: #555;
      font-size: 11px;
      cursor: pointer;
      padding: 0 2px;
      text-decoration: underline;
    }
    .btn-bypass:hover { color: #aaa; }
    .prefix-banner {
      background: #1e293b;
      border: 1px solid #2a3a4a;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }
    .prefix-banner code { color: #7dd3fc; }
    .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0; color: #444; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2a2a2a; }
    .submit-row { display: flex; justify-content: flex-end; margin-top: 1rem; }
    .success-box { text-align: center; }
    .success-box .success-icon { font-size: 3rem; margin-bottom: 1rem; }
    .success-box p { color: #86efac; font-size: 14px; }
    .file-drop-zone {
      border: 1.5px dashed #3a3a3a;
      border-radius: 8px;
      padding: 1.25rem;
      text-align: center;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: border-color 0.15s, color 0.15s;
      user-select: none;
    }
    .file-drop-zone:hover, .file-drop-zone.drag-over { border-color: #555; color: #aaa; }
    .file-drop-zone strong { color: #888; }
  </style>
</head>
<body class="login-page">
  <div class="collect-box">
    <div class="share-brand"><img src="https://static.layer55.eu/kv/kv_logo.svg" alt="KV Manager" class="share-brand-logo"></div>
    <div class="collect-icon">🔏</div>
    <h1 id="page-title">Requested values</h1>
    <p id="page-desc" class="collect-desc hidden"></p>

    <div id="step-form">
      <div id="prefix-banner" class="prefix-banner hidden"></div>

      <p class="label-sm" style="margin-bottom:0.5rem;">Key / Value pairs</p>
      <div class="kv-pairs" id="kv-pairs">
        <div class="kv-row">
          <input placeholder="KEY_NAME" class="kv-key" autocomplete="off" spellcheck="false">
          <input placeholder="value" class="kv-val" autocomplete="off">
          <button type="button" class="btn-icon" onclick="removeRow(this)" title="Remove">✕</button>
        </div>
      </div>
      <button type="button" class="btn-secondary" onclick="addRow()" style="margin-bottom:1rem;">+ Add row</button>

      <div class="divider">or load from file</div>

      <div id="file-drop-zone" class="file-drop-zone" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept=".env,.json" style="display:none">
        <span id="file-drop-label">Click to upload or drag &amp; drop a <strong>.env</strong> or <strong>.json</strong> file</span>
      </div>

      <div class="submit-row">
        <button type="button" class="btn" onclick="submitSecrets()">Submit secrets</button>
      </div>
    </div>

    <div id="step-done" class="success-box hidden">
      <div class="success-icon">✅</div>
      <p>Secrets received. This link has been deactivated.</p>
    </div>

    <div id="step-invalid" class="success-box hidden">
      <div class="success-icon">🚫</div>
      <p id="invalid-reason" style="color:#fca5a5;font-size:14px;"></p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // ── Toast system ────────────────────────────────────────────────────────
    const activeToasts = new Map();

    function showToast(msg, { id = null, persistent = false, type = 'info' } = {}) {
      if (id && activeToasts.has(id)) return activeToasts.get(id);
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span>${msg}</span>${persistent ? `<button onclick="dismissToast('${id || ''}', this)">✕</button>` : ''}`;
      document.getElementById('toast-container').appendChild(el);
      requestAnimationFrame(() => el.classList.add('toast-show'));
      if (id) activeToasts.set(id, el);
      if (!persistent) setTimeout(() => removeToast(el, id), 3000);
      return el;
    }

    function removeToast(el, id = null) {
      el.classList.remove('toast-show');
      el.addEventListener('transitionend', () => el.remove(), { once: true });
      if (id) activeToasts.delete(id);
    }

    function dismissToast(id, btn) {
      if (id && activeToasts.has(id)) {
        removeToast(activeToasts.get(id), id);
      } else {
        removeToast(btn.closest('.toast'));
      }
    }

    // ── Utilities ───────────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Validation ──────────────────────────────────────────────────────────
    const KEY_MAX = 255;
    const VAL_MAX = 65535;
    const KEY_RE = /^[A-Za-z0-9_-]+$/;

    function validateRow(row) {
      const key = row.querySelector('.kv-key').value.trim();
      const val = row.querySelector('.kv-val').value;
      if (!key) return null;
      if (!KEY_RE.test(key)) return `Key "${key}" — only letters, numbers, _ and - are allowed.`;
      if (key.length > KEY_MAX) return `Key "${key.slice(0, 24)}…" exceeds ${KEY_MAX} characters.`;
      if (val.length > VAL_MAX) return `Value for "${key}" exceeds ${VAL_MAX} characters.`;
      return null;
    }

    function attachValidation(row) {
      const keyInput = row.querySelector('.kv-key');
      if (!keyInput.readOnly) {
        keyInput.addEventListener('blur', () => {
          const err = validateRow(row);
          if (err) showToast(err, { type: 'error' });
        });
      }
    }

    // Attach to the initial static row
    attachValidation(document.querySelector('.kv-row'));

    // ── Request state ───────────────────────────────────────────────────────
    const id = new URLSearchParams(location.search).get('id');
    let keyPrefix = '';
    let requiredKeys = [];

    if (!id) {
      showInvalid('Invalid link — no request ID found.');
    } else {
      loadRequest();
    }

    async function loadRequest() {
      try {
        const resp = await fetch('/api/collect/' + encodeURIComponent(id));
        if (resp.status === 404) { showInvalid('This link does not exist.'); return; }
        if (!resp.ok) { showInvalid('Failed to load request (' + resp.status + ').'); return; }

        const data = await resp.json();

        document.getElementById('page-title').textContent = data.owner_label + ' requested values:';

        if (data.description) {
          const desc = document.getElementById('page-desc');
          desc.textContent = data.description;
          desc.classList.remove('hidden');
        }

        if (data.status === 'fulfilled') {
          showInvalid('This link has already been used.');
          return;
        } else if (data.status === 'revoked') {
          showInvalid('This link has been revoked.');
          return;
        }

        keyPrefix = data.key_prefix || '';
        requiredKeys = data.required_keys || [];

        if (keyPrefix) {
          const banner = document.getElementById('prefix-banner');
          banner.innerHTML = `All keys will be stored with prefix: <code>${esc(keyPrefix)}</code>`;
          banner.classList.remove('hidden');
        }

        if (requiredKeys.length) {
          addRequiredRows(requiredKeys);
        }
      } catch (e) {
        showInvalid('Could not reach the server.');
      }
    }

    // ── Required rows ───────────────────────────────────────────────────────
    function addRequiredRows(keys) {
      const container = document.getElementById('kv-pairs');
      // Clear out the default empty row if it's truly empty
      const existing = container.querySelectorAll('.kv-row');
      if (existing.length === 1) {
        const k = existing[0].querySelector('.kv-key').value.trim();
        const v = existing[0].querySelector('.kv-val').value.trim();
        if (!k && !v) container.innerHTML = '';
      }
      for (const key of keys) {
        const wrapper = document.createElement('div');
        wrapper.className = 'kv-required-wrapper';
        wrapper.dataset.requiredKey = key;

        const row = document.createElement('div');
        row.className = 'kv-row required-row';
        row.innerHTML = `
          <input class="kv-key" value="${esc(key)}" readonly>
          <input placeholder="value (required)" class="kv-val" autocomplete="off">
          <button type="button" class="btn-bypass" onclick="toggleBypass(this)" title="Bypass this field">bypass</button>
        `;
        const bypassRow = document.createElement('div');
        bypassRow.className = 'bypass-row hidden';
        bypassRow.innerHTML = `
          <label>Bypass note:</label>
          <input class="bypass-note" placeholder="Reason for not providing this value…" autocomplete="off">
        `;
        wrapper.appendChild(row);
        wrapper.appendChild(bypassRow);
        container.appendChild(wrapper);
      }
      // Re-add the blank row for optional extras after required ones
      const extraRow = document.createElement('div');
      extraRow.className = 'kv-row';
      extraRow.innerHTML = `
        <input placeholder="KEY_NAME" class="kv-key" autocomplete="off" spellcheck="false">
        <input placeholder="value" class="kv-val" autocomplete="off">
        <button type="button" class="btn-icon" onclick="removeRow(this)" title="Remove">✕</button>
      `;
      container.appendChild(extraRow);
      attachValidation(extraRow);
    }

    function toggleBypass(btn) {
      const wrapper = btn.closest('.kv-required-wrapper');
      const bypassRow = wrapper.querySelector('.bypass-row');
      const valInput = wrapper.querySelector('.kv-val');
      const bypassNote = wrapper.querySelector('.bypass-note');
      const isBypassing = !bypassRow.classList.contains('hidden');
      if (isBypassing) {
        bypassRow.classList.add('hidden');
        bypassNote.value = '';
        valInput.disabled = false;
        valInput.placeholder = 'value (required)';
        btn.textContent = 'bypass';
      } else {
        bypassRow.classList.remove('hidden');
        valInput.disabled = true;
        valInput.value = '';
        valInput.placeholder = '(bypassed)';
        btn.textContent = 'undo';
        bypassNote.focus();
      }
    }

    // ── KV row management ───────────────────────────────────────────────────
    function addRow() {
      const row = document.createElement('div');
      row.className = 'kv-row';
      row.innerHTML = `
        <input placeholder="KEY_NAME" class="kv-key" autocomplete="off" spellcheck="false">
        <input placeholder="value" class="kv-val" autocomplete="off">
        <button type="button" class="btn-icon" onclick="removeRow(this)" title="Remove">✕</button>
      `;
      document.getElementById('kv-pairs').appendChild(row);
      attachValidation(row);
      row.querySelector('.kv-key').focus();
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('#kv-pairs > .kv-row');
      if (rows.length <= 1) {
        btn.closest('.kv-row').querySelectorAll('input').forEach(i => i.value = '');
        return;
      }
      btn.closest('.kv-row').remove();
    }

    // ── File parsing ────────────────────────────────────────────────────────
    function parseEnv(text) {
      const entries = [];
      for (const line of text.split('\n')) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;
        const eq = trimmed.indexOf('=');
        if (eq === -1) continue;
        const key = trimmed.slice(0, eq).trim();
        let value = trimmed.slice(eq + 1).trim();
        if ((value.startsWith('"') && value.endsWith('"')) ||
            (value.startsWith("'") && value.endsWith("'"))) {
          value = value.slice(1, -1);
        }
        if (key) entries.push({ key, value });
      }
      return entries;
    }

    function parseJson(text) {
      let parsed;
      try { parsed = JSON.parse(text); } catch { return null; }
      if (Array.isArray(parsed)) {
        return parsed
          .filter(e => e && typeof e.key === 'string')
          .map(e => ({ key: e.key.trim(), value: String(e.value ?? '') }));
      }
      if (parsed && typeof parsed === 'object') {
        return Object.entries(parsed).map(([key, value]) => ({ key: key.trim(), value: String(value) }));
      }
      return null;
    }

    function populateRows(entries) {
      const container = document.getElementById('kv-pairs');
      // Find all non-required rows and replace a single empty one
      const regularRows = container.querySelectorAll(':scope > .kv-row');
      if (regularRows.length === 1) {
        const k = regularRows[0].querySelector('.kv-key').value.trim();
        const v = regularRows[0].querySelector('.kv-val').value.trim();
        if (!k && !v) regularRows[0].remove();
      }
      for (const { key, value } of entries) {
        const row = document.createElement('div');
        row.className = 'kv-row';
        row.innerHTML = `
          <input placeholder="KEY_NAME" class="kv-key" autocomplete="off" spellcheck="false" value="${esc(key)}">
          <input placeholder="value" class="kv-val" autocomplete="off" value="${esc(value)}">
          <button type="button" class="btn-icon" onclick="removeRow(this)" title="Remove">✕</button>
        `;
        container.appendChild(row);
        attachValidation(row);
      }
    }

    async function loadFile(file) {
      const text = await file.text();
      const ext = file.name.split('.').pop().toLowerCase();
      let entries;
      if (ext === 'json') {
        entries = parseJson(text);
        if (!entries) {
          showToast('Unrecognized JSON format. Expected a flat object {"KEY":"value"} or array [{key, value}].', { type: 'error' });
          return;
        }
      } else {
        entries = parseEnv(text);
      }
      if (!entries.length) {
        showToast('No valid entries found in file.', { type: 'error' });
        return;
      }
      populateRows(entries);
      document.getElementById('file-drop-label').textContent =
        `Loaded ${entries.length} entr${entries.length === 1 ? 'y' : 'ies'} from ${file.name}`;
    }

    // ── File drop zone wiring ───────────────────────────────────────────────
    document.getElementById('file-input').addEventListener('change', e => {
      if (e.target.files[0]) loadFile(e.target.files[0]);
    });

    const dropZone = document.getElementById('file-drop-zone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    // ── Submit ──────────────────────────────────────────────────────────────
    async function submitSecrets() {
      // 1. Validate all regular rows
      const validationErrors = [];
      document.querySelectorAll('#kv-pairs > .kv-row').forEach(row => {
        const err = validateRow(row);
        if (err) validationErrors.push(err);
      });
      if (validationErrors.length) {
        validationErrors.forEach(e => showToast(e, { type: 'error' }));
        return;
      }

      // 2. Check required rows: must have a value or a bypass note
      const missingRequired = [];
      const bypasses = [];
      document.querySelectorAll('.kv-required-wrapper').forEach(wrapper => {
        const key = wrapper.dataset.requiredKey;
        const bypassRow = wrapper.querySelector('.bypass-row');
        const isBypassing = !bypassRow.classList.contains('hidden');
        if (isBypassing) {
          const note = wrapper.querySelector('.bypass-note').value.trim();
          if (!note) {
            missingRequired.push({ key, reason: 'bypass-no-note' });
          } else {
            bypasses.push({ key, note });
          }
        } else {
          const val = wrapper.querySelector('.kv-val').value;
          if (!val) {
            missingRequired.push({ key, reason: 'empty' });
          }
        }
      });

      if (missingRequired.length) {
        for (const { key, reason } of missingRequired) {
          if (reason === 'bypass-no-note') {
            showToast(`Please provide a bypass reason for "${key}".`, { type: 'error' });
          } else {
            showToast(`"${key}" was explicitly requested — please fill it in (or use bypass).`, { type: 'error' });
          }
        }
        return;
      }

      // 3. Collect all entries
      const entries = [];

      // Required rows (non-bypassed)
      document.querySelectorAll('.kv-required-wrapper').forEach(wrapper => {
        const key = wrapper.dataset.requiredKey;
        const bypassRow = wrapper.querySelector('.bypass-row');
        if (bypassRow.classList.contains('hidden')) {
          entries.push({ key, value: wrapper.querySelector('.kv-val').value });
        }
      });

      // Regular rows
      document.querySelectorAll('#kv-pairs > .kv-row').forEach(row => {
        const key = row.querySelector('.kv-key').value.trim();
        const value = row.querySelector('.kv-val').value;
        if (key) entries.push({ key, value });
      });

      if (entries.length === 0 && bypasses.length === 0) {
        showToast('Please add at least one key-value pair.', { type: 'error' });
        return;
      }

      try {
        const resp = await fetch('/api/collect/' + encodeURIComponent(id) + '/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entries, bypasses: bypasses.length ? bypasses : undefined }),
        });

        if (resp.status === 403) {
          showInvalid('This link has already been used or revoked.');
          return;
        }
        if (resp.status === 409) {
          const data = await resp.json();
          const keys = (data.keys || []).join(', ');
          showToast('Key conflict: ' + keys + '. Please use a different name.', { type: 'error' });
          return;
        }
        if (!resp.ok) {
          showToast('Submission failed (' + resp.status + '). Please try again.', { type: 'error' });
          return;
        }

        document.getElementById('step-form').classList.add('hidden');
        document.getElementById('step-done').classList.remove('hidden');
      } catch (e) {
        showToast('Could not reach the server. Please check your connection.', { type: 'error' });
      }
    }

    function showInvalid(reason) {
      document.getElementById('step-form').classList.add('hidden');
      document.getElementById('step-invalid').classList.remove('hidden');
      document.getElementById('invalid-reason').textContent = reason;
    }
  </script>
</body>
</html>
