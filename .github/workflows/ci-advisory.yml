name: CI (advisory)

# NON-BLOCKING pipeline - never fails the merge request. Posts a PR comment
# recommending places to look, then always exits successfully.
#
# From "Rust: Don't Panic" (No Boilerplate,
# https://www.youtube.com/watch?v=usRlRCNIOG0): Clippy's `pedantic` and
# `nursery` lint groups "will teach you good Rust habits," but the video is
# explicit that "the lints in nursery are not guaranteed to be free from
# false positives" - i.e. this tier is for *learning*, not for gating
# merges. That's the whole reason this is a second, separate, non-blocking
# workflow rather than being folded into ci-required.yml.
#
# This workflow does NOT run the panic-safety lints (unwrap_used,
# expect_used, panic, etc.) - those are `deny` in Cargo.toml and already
# enforced by the blocking ci-required.yml job; duplicating them here would
# be redundant.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-advisory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

env:
  SQLX_OFFLINE: "true"

jobs:
  clippy-advisory:
    name: Clippy pedantic + nursery (advisory only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run pedantic + nursery clippy (never fails the job)
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --bins --message-format=json \
            -- -W clippy::pedantic -W clippy::nursery \
            > clippy-advisory.json || true

      - name: Summarize into a PR comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYEOF'
          import json, collections, os

          counts = collections.Counter()
          by_file = collections.defaultdict(list)

          with open("clippy-advisory.json") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      msg = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if msg.get("reason") != "compiler-message":
                      continue
                  m = msg.get("message", {})
                  if m.get("level") != "warning":
                      continue
                  code = (m.get("code") or {}).get("code", "")
                  if not code.startswith("clippy::"):
                      continue
                  spans = m.get("spans", [])
                  primary = next((s for s in spans if s.get("is_primary")), spans[0] if spans else None)
                  loc = f"{primary['file_name']}:{primary['line_start']}" if primary else "?"
                  counts[code] += 1
                  by_file[loc].append((code, m.get("message", "")))

          total = sum(counts.values())
          lines = []
          if total == 0:
              lines.append("No `pedantic`/`nursery` suggestions on this diff. Nice.")
          else:
              lines.append(f"**{total}** `clippy::pedantic`/`clippy::nursery` suggestion(s) found. "
                            "These are advisory only (per the panic-safety video notes, "
                            "`nursery` isn't guaranteed false-positive-free) - this check does not "
                            "block merging, but is worth a look.")
              lines.append("")
              lines.append("| Lint | Count |")
              lines.append("|------|-------|")
              for code, n in counts.most_common(15):
                  lines.append(f"| `{code}` | {n} |")
              lines.append("")
              lines.append("<details><summary>Locations</summary>\n")
              for loc, items in sorted(by_file.items())[:40]:
                  code, msg = items[0]
                  lines.append(f"- `{loc}` - {msg} (`{code}`)" + (f" +{len(items)-1} more here" if len(items) > 1 else ""))
              lines.append("\n</details>")

          body = "### 🔎 Clippy advisory report\n\n" + "\n".join(lines) + \
                 "\n\n<!-- ci-advisory-clippy-comment -->"

          with open("comment-body.md", "w") as f:
              f.write(body)
          PYEOF

      - name: Find existing advisory comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: ci-advisory-clippy-comment

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: comment-body.md
          edit-mode: replace

      - name: Job always succeeds (advisory only)
        if: always()
        run: exit 0
