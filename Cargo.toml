[package]
name = "kv_manager"
version = "0.1.0"
edition = "2021"

# Panic-safety gate. From the "Rust: Don't Panic" video (No Boilerplate,
# https://www.youtube.com/watch?v=usRlRCNIOG0): chapter 9 of the Rust book
# names three ways Rust code crashes - (1) explicit `panic!`, (2) implicit
# panics like out-of-bounds indexing, (3) unwrapping an `Err`/`None` - and
# the fix is to have local tooling AND CI throw out any code that can hit
# them. `deny` here only affects `cargo clippy` runs (never plain `cargo
# build`/`check`), so it can't slow down or break routine compilation; it's
# enforced by .github/workflows/ci-required.yml. Test code is exempted via
# clippy.toml's `allow-*-in-tests` keys. `pedantic`/`nursery` (the video's
# "teach you good habits" tier, explicitly not false-positive-free) are
# deliberately NOT declared here - see ci-advisory.yml instead.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[[bin]]
name = "kv_manager"
path = "src/main.rs"

[[bin]]
name = "kv_cli"
path = "cli/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono", "uuid"] }

openidconnect = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sha2 = "0.10"
bcrypt = "0.15"
hex = "0.4"
rand = "0.8"
base64 = { version = "0.22", features = ["std"] }
hmac = "0.12"

dotenvy = "0.15"
dashmap = "5"
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

thiserror = "1"
anyhow = "1"

include_dir = "0.7"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
time = "0.3"

webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
url = "2"
jsonwebtoken = "9"

# CLI
qrcode = { version = "0.14", default-features = false }
dirs = "5"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"
rstest = "0.23"
